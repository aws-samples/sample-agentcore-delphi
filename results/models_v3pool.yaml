# v3 real-model run (2026-10-28): the v2 pool plus six models from tiny to frontier.
# Prices: AWS Price List API, AmazonBedrock / AmazonBedrockFoundationModels, us-west-2,
# on-demand standard (pulled 2026-10-28). The first three are unchanged from
# models_realrun.yaml so the v2 answers are reused as-is. Claude Sonnet 5.5 rejects
# `temperature`, so it runs at its provider default (sampling: provider-default); every
# other arm keeps temperature 0 / topP 1 (the author's decision, disclosed as a parity exception).

pricing_snapshot:
  source: aws-price-list-api
  service_code: AmazonBedrock
  region: us-west-2
  publication_date: "2026-10-28"
  pulled_date: "2026-10-28"
  pricing_model: on-demand-standard

candidates:
