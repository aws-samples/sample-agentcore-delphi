    id: us.amazon.nova-lite-v1:0
    family: nova
    price_per_1k: {input: 0.00006, output: 0.00024}
    verified: true
  - alias: nova-pro
    id: us.amazon.nova-pro-v1:0
    family: nova
    price_per_1k: {input: 0.0008, output: 0.0032}
