# Real, invokable 3-model pool for LIVE router-arm validation on AgentCore (us-west-2).
# All three are confirmed available via us. cross-region inference profiles for on-demand
# Converse. Prices are the verified July-2026 snapshot values.
# NOTE: this pool exists to validate the routing MECHANISM end-to-end on real Bedrock.
# Routing quality is synthetic-derived (labels come from the Delphi-Trials council remap),
# so it is NOT a quality claim — it proves load + route-across-models + real answers.

pricing_snapshot:
  source: aws-price-list-api
  service_code: AmazonBedrock
  region: us-west-2
  publication_date: "2026-07-07"
  pulled_date: "2026-07-15"
  pricing_model: on-demand-standard

candidates:
